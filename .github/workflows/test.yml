name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install Playwright browsers
        working-directory: packages/app
        run: bunx playwright install --with-deps

      - name: Seed voltcode data
        working-directory: packages/voltcode
        run: bun script/seed-e2e.ts
        env:
          MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/voltcode/test/tool/fixtures/models-api.json
          VOLTCODE_DISABLE_MODELS_FETCH: "true"
          VOLTCODE_DISABLE_SHARE: "true"
          VOLTCODE_DISABLE_LSP_DOWNLOAD: "true"
          VOLTCODE_DISABLE_DEFAULT_PLUGINS: "true"
          VOLTCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          VOLTCODE_TEST_HOME: ${{ runner.temp }}/voltcode-e2e/home
          XDG_DATA_HOME: ${{ runner.temp }}/voltcode-e2e/share
          XDG_CACHE_HOME: ${{ runner.temp }}/voltcode-e2e/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/voltcode-e2e/config
          XDG_STATE_HOME: ${{ runner.temp }}/voltcode-e2e/state
          VOLTCODE_E2E_PROJECT_DIR: ${{ github.workspace }}
          VOLTCODE_E2E_SESSION_TITLE: "E2E Session"
          VOLTCODE_E2E_MESSAGE: "Seeded for UI e2e"
          VOLTCODE_E2E_MODEL: "voltcode/gpt-5-nano"

      - name: Run voltcode server
        run: bun run dev -- --print-logs --log-level WARN serve --port 4096 --hostname 0.0.0.0 &
        env:
          MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/voltcode/test/tool/fixtures/models-api.json
          VOLTCODE_DISABLE_MODELS_FETCH: "true"
          VOLTCODE_DISABLE_SHARE: "true"
          VOLTCODE_DISABLE_LSP_DOWNLOAD: "true"
          VOLTCODE_DISABLE_DEFAULT_PLUGINS: "true"
          VOLTCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          VOLTCODE_TEST_HOME: ${{ runner.temp }}/voltcode-e2e/home
          XDG_DATA_HOME: ${{ runner.temp }}/voltcode-e2e/share
          XDG_CACHE_HOME: ${{ runner.temp }}/voltcode-e2e/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/voltcode-e2e/config
          XDG_STATE_HOME: ${{ runner.temp }}/voltcode-e2e/state
          VOLTCODE_CLIENT: "app"

      - name: Wait for voltcode server
        run: |
          for i in {1..60}; do
            curl -fsS "http://localhost:4096/global/health" > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: run
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "voltcode"
          bun turbo typecheck
          bun turbo test
        env:
          CI: true
          MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/voltcode/test/tool/fixtures/models-api.json
          VOLTCODE_DISABLE_MODELS_FETCH: "true"
          VOLTCODE_DISABLE_SHARE: "true"
          VOLTCODE_DISABLE_LSP_DOWNLOAD: "true"
          VOLTCODE_DISABLE_DEFAULT_PLUGINS: "true"
          VOLTCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          VOLTCODE_TEST_HOME: ${{ runner.temp }}/voltcode-e2e/home
          XDG_DATA_HOME: ${{ runner.temp }}/voltcode-e2e/share
          XDG_CACHE_HOME: ${{ runner.temp }}/voltcode-e2e/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/voltcode-e2e/config
          XDG_STATE_HOME: ${{ runner.temp }}/voltcode-e2e/state
          PLAYWRIGHT_SERVER_HOST: "localhost"
          PLAYWRIGHT_SERVER_PORT: "4096"
          VITE_VOLTCODE_SERVER_HOST: "localhost"
          VITE_VOLTCODE_SERVER_PORT: "4096"
          VOLTCODE_CLIENT: "app"
        timeout-minutes: 30
